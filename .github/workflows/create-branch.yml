name: Create Codespect Scan Branch

on: 
  workflow_dispatch: 

# Grant explicit write permissions to create the branch
permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all historical data and tracking branches
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Create and Push Branch Cleanly
        run: |
          # Fetch latest tracking info from GitHub
          git fetch origin
          
          # Force create the branch directly from the origin's default branch
          # Works seamlessly whether your default branch is named 'main' or 'master'
          git checkout -B codespect-full-scan origin/${{ github.event.repository.default_branch }}
          
          # Push the branch back up to the remote repository
          git push origin codespect-full-scan --force
