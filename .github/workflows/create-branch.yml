name: Create Codespect Scan Branch

on: 
  workflow_dispatch: 

# Explicitly grant your workflow permission to write new code branches
permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Downloads complete repository history and branches
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Configure Git Workspace Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Fetch, Branch, and Push
        run: |
          # Fetch the latest updates directly from your cloud repository
          git fetch origin
          
          # Safely cut a clean branch directly tracking your cloud's default branch (main/master)
          git checkout -B codespect-full-scan origin/${{ github.event.repository.default_branch }}
          
          # Overwrite and host the target CodeSpect scan branch on GitHub
          git push origin codespect-full-scan --force
